<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"accent","type":"color","label":"强调色","default":"#70c9bc"},
  {"id":"size","type":"number","label":"大小","default":1,"min":0.5,"max":2,"step":0.01},
  {"id":"duration","type":"number","label":"实例时长（秒）","default":6.7,"min":3,"max":60,"step":0.1}
]'>
  <head>
    <meta charset="utf-8" />
    <title>PD-GOLDEN-S04-SCFA-FLOW · HyperFrames Project Draft</title>
    <style>
      [data-composition-id="pd-golden-s04-scfa-flow"] {
        --ink: #f8fafc;
        --muted: rgba(248,250,252,.72);
        --accent: #70c9bc;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      .flow-card { position: absolute; left: 110px; top: 88px; width: 1320px; padding: 48px 54px 58px; border: 1px solid rgba(112,201,188,.4); border-radius: 30px; background: linear-gradient(155deg, rgba(12,38,43,.92), rgba(6,16,24,.86)); box-shadow: 0 32px 82px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.1); }
      .flow-title { margin: 0; color: var(--accent); font-size: 34px; font-weight: 900; letter-spacing: .04em; }
      .flow-grid { position: relative; display: grid; grid-template-columns: 1.1fr 88px 1.1fr; gap: 20px; align-items: center; margin-top: 34px; }
      .node { display: grid; place-items: center; min-height: 154px; padding: 26px; border: 1px solid rgba(255,255,255,.17); border-radius: 22px; background: rgba(255,255,255,.075); color: var(--ink); font-size: 38px; font-weight: 850; line-height: 1.28; text-align: center; }
      .source-node { border-color: color-mix(in srgb, var(--accent) 64%, transparent); box-shadow: inset 0 0 46px rgba(112,201,188,.12); }
      .connector { position: relative; height: 100%; min-height: 180px; }
      .connector::before { position: absolute; left: 0; right: 0; top: 50%; height: 4px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 18px rgba(112,201,188,.7); content: ""; }
      .connector::after { position: absolute; right: -2px; top: calc(50% - 12px); width: 0; height: 0; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 18px solid var(--accent); content: ""; }
      .outcomes { display: grid; gap: 18px; }
      .outcome { min-height: 70px; font-size: 30px; font-weight: 750; }
    </style>
  </head>
  <body>
    <main data-composition-id="pd-golden-s04-scfa-flow" data-width="1920" data-height="1080">
      <section class="flow-card" data-card>
        <h1 class="flow-title" data-title></h1>
        <div class="flow-grid">
          <div class="node source-node" data-source></div>
          <div class="connector" data-connector aria-hidden="true"></div>
          <div class="outcomes" data-outcomes></div>
        </div>
      </section>
      <script type="application/json" data-hf-content>
        {"title":"2 / 4 · 分解黏液","source":"产生短链脂肪酸","outcomes":["给肠道细胞提供能量","传递代谢信号"]}
      </script>
      <script src="__R3_GSAP_ENTRY__"></script>
      <script src="__R3_COMPONENT_KIT_ENTRY__"></script>
      <script>
        (function () {
          hfComponentKit.mount({
            id: 'pd-golden-s04-scfa-flow',
            mount: 'none',
            options: variables => ({
              accent: String(variables.accent || '#70c9bc'),
              size: Math.min(2, Math.max(.5, Number(variables.size) || 1)),
              duration: Math.max(3, Number(variables.duration) || 6.7),
            }),
            build(ctx) {
              const { root, content, options, timeline } = ctx;
              const card = root.querySelector('[data-card]');
              const outcomesHost = root.querySelector('[data-outcomes]');
              root.style.setProperty('--accent', options.accent);
              card.style.scale = String(options.size);
              root.querySelector('[data-title]').textContent = String(content.title || '');
              root.querySelector('[data-source]').textContent = String(content.source || '');
              outcomesHost.textContent = '';
              const outcomes = Array.isArray(content.outcomes) ? content.outcomes.slice(0, 2) : [];
              outcomes.forEach((outcome, index) => {
                const node = document.createElement('div');
                node.className = 'node outcome';
                node.setAttribute('data-outcome-index', String(index));
                node.textContent = String(outcome || '');
                outcomesHost.appendChild(node);
              });
              timeline.from(card, { opacity: 0, y: 38, duration: .48, ease: 'power3.out' }, 0);
              timeline.from(root.querySelector('[data-source]'), { opacity: 0, scale: .84, duration: .34, ease: 'back.out(1.3)' }, .18);
              timeline.from(root.querySelector('[data-connector]'), { opacity: 0, scaleX: 0, transformOrigin: 'left center', duration: .34, ease: 'power2.out' }, .42);
              timeline.from(outcomesHost.children, { opacity: 0, x: 30, stagger: .16, duration: .32, ease: 'power3.out' }, .58);
              ctx.setAttr(root, 'data-project-draft', 'PD-GOLDEN-S04-SCFA-FLOW');
              ctx.meta = { kind: 'FLOW_RELATIONSHIP', outcomes: outcomes.length };
            },
          });
        })();
      </script>
    </main>
  </body>
</html>
