<!doctype html>
<!--
  组件库 · 技能介绍卡详情页（HyperFrames 内壳复刻件）

  Role: Reference（冒烟测试件，不是基线）

  这是 Remotion 组件库详情页（LIB-01）的 HyperFrames 版本：
    · 顶栏 / 左栏 / 中栏 / 右栏的结构与类名照抄真实工作台，样式直接引用
      workbench-v0/src/styles.css + component-library/library.css + shared/component-config/component-config.css，
      不新造第二套视觉语言；
    · 左栏是不可点的布景：整列 pointer-events: none，只有「核心观点 → 技能介绍卡」这一项是真实存在的组件；
    · 中栏预览的渲染内核是 HyperFrames（<hyperframes-player>），外壳仍是我们自己的预览控制条；
    · 右栏配置是活的：滑杆 / 主题 / 底色 / Markdown 内容都实时写进合成（只做预览，刷新即回默认）。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组件库 · 技能介绍卡（HyperFrames 内壳）</title>

  <!-- 真实工作台样式（只读引用，避免出现第二套视觉语言） -->
  <link rel="stylesheet" href="/shared-ui/styles.css">
  <link rel="stylesheet" href="/shared-ui/component-library/library.css">
  <link rel="stylesheet" href="/shared-ui/shared/component-config/component-config.css">
  <!-- 预览内核：我们自己的播放器外壳（与独立播放器页共用同一份） -->
  <link rel="stylesheet" href="/player/player-chrome.css">
  <link rel="stylesheet" href="./library-page.css">

  <script src="/engine/hyperframes/hyperframes-player.global.js"></script>
</head>
<body>
  <div class="workbench-app">
    <header class="topbar">
      <div class="brand" aria-label="AI Director Workbench">
        <span class="brand-mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg></span>
        <span class="brand-name">AI DIRECTOR</span>
        <span class="version-chip">V0</span>
      </div>

      <div class="topbar-project">
        <button class="project-switcher is-empty" type="button" tabindex="-1" aria-label="创建你的新项目">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span class="project-switcher-name">创建你的新项目</span>
        </button>
      </div>

      <nav class="global-nav" aria-label="全局模块">
        <button class="global-nav-item" type="button" tabindex="-1">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <span>导演台</span>
        </button>
        <button class="global-nav-item is-active" type="button" tabindex="-1" aria-current="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
          <span>组件库</span>
        </button>
        <button class="global-nav-item" type="button" tabindex="-1">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
          <span>Wiki</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <span class="mock-status"><span class="mock-dot is-local"></span> LOCAL RUNTIME</span>
        <button class="icon-button dark" type="button" tabindex="-1" aria-label="收起右侧抽屉" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/></svg>
        </button>
      </div>
    </header>

    <div class="workbench-body without-inspector">
      <!-- 左栏：资产导航（不可点，整列 pointer-events: none；内容由 library-host.js 按截图快照生成） -->
      <aside class="sidebar library-nav" id="libraryNav" aria-label="组件资产导航"></aside>

      <main class="canvas library-workspace is-detail" id="main-content">
        <!-- ② 频道页：选中二级入口后的组件卡片网格（由 library-host.js 渲染） -->
        <div id="channelView" hidden></div>

        <!-- ③ 详情页：HyperFrames 预览 + 组件信息 + 右栏配置 -->
        <div id="detailView">
        <section class="library-detail" aria-label="组件详情">
          <div class="library-detail-grid">
            <div class="library-detail-main">
              <div class="library-detail-identity">
                <button class="library-back" type="button" tabindex="-1" aria-disabled="true">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                  返回
                </button>
                <div class="library-detail-title">
                  <h1>技能介绍卡</h1>
                  <p>
                    <span>CMP-SKL-001</span>
                    <span>v1.0.0</span>
                    <span class="is-registered">REGISTERED</span>
                  </p>
                </div>
              </div>

              <div class="library-preview">
                <!-- 预览外壳（画布 + 控制条 + 安全区）由 preview-chrome.js 装配 -->
                <div class="library-player-space" id="playerSpace"></div>
                <div class="library-preview-footer">
                  <span class="library-preview-meta" data-library-preview-meta id="previewMeta">画幅 16:9 · 1920 × 1080 · 30 fps · 360 帧 · 12.0 秒</span>
                </div>
              </div>

              <section class="library-info" aria-label="组件信息">
                <h2>组件信息</h2>
                <dl id="componentInfo"></dl>
              </section>

              <div class="library-detail-actions">
                <p>这是 HyperFrames 内壳复刻件：《组件定义》不在本页编辑，右侧配置只做即时预览，刷新即回到默认。</p>
              </div>
            </div>

            <aside class="library-detail-controls" id="library-detail-drawer" aria-label="配置试填">
              <header class="library-config-header drawer-header">
                <p class="drawer-eyebrow">组件配置</p>
                <div class="library-config-heading-row">
                  <div class="drawer-title"><i class="drawer-title-marker" aria-hidden="true"></i><h2>组件设置</h2></div>
                  <span class="drawer-status drawer-status--success">仅做预览</span>
                </div>
              </header>
              <div class="library-controls" id="inspector"></div>
            </aside>
          </div>
        </section>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./library-host.js"></script>
</body>
</html>
