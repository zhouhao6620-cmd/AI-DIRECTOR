<!doctype html>
<!--
  CMP-CHP-001 章节进度条 · HyperFrames 子合成

  Role: Reference（HyperFrames 组件库改造，不是基线）
  事实源：workbench-v0/platform/components/chapter-progress/**（只读复制，未改动原文件）
          · 版式常量：layout.js SOURCE_GEOMETRY（48px 条高 / 21px 字号 / 0.08em 字距 / 1px 分隔线 / 4px 进度线）
          · 进度算法：layout.js resolveChapterTimeline（当前章 = 最后一个已开始的章；填充 =（已完成章 + 本章进度）/ 章数）
          · 配色：model.js SURFACE_TOKENS / ACCENTS / PROGRESS_ALPHA
          · 实例契约：definition.json（2–8 章，标签 ≤12 字，变体 FILL / LINE）

  契约 v2（与技能卡的区别）：内容树是数组（chapters），不能塞进标量变量，
  所以内容走 data-hf-content 内联样例 + 运行时 content 补丁；标量选项仍走 HyperFrames Variables。
-->
<html lang="zh-CN" data-composition-variables='[
  {"id":"surface","type":"enum","label":"底色","default":"DARK","options":[{"value":"DARK","label":"深色"},{"value":"LIGHT","label":"浅色"}]},
  {"id":"variant","type":"enum","label":"变体","default":"FILL","options":[{"value":"FILL","label":"填充进度"},{"value":"LINE","label":"线条进度"}]},
  {"id":"showProgress","type":"boolean","label":"显示进度","default":true},
  {"id":"accent","type":"color","label":"强调色","default":"#5fa0fa"},
  {"id":"size","type":"number","label":"大小","default":1,"min":0.5,"max":2,"step":0.01},
  {"id":"duration","type":"number","label":"实例时长（秒）","default":12,"min":3,"max":60,"step":0.1},
  {"id":"position-x","type":"number","label":"水平位置","default":0.5,"min":0,"max":1,"step":0.01},
  {"id":"position-y","type":"number","label":"垂直位置","default":0.5,"min":0,"max":1,"step":0.01}
]'>
<head><script src="/engine/hyperframes/hyperframe.runtime.iife.js"></script>
  <meta charset="utf-8">
  <title>CMP-CHP-001 章节进度条 · HyperFrames</title>
  <style>
    /* 版式常量（逐项对应 layout.js SOURCE_GEOMETRY；源舞台 1920×1080 与本画布等面积 → scale = 1） */
    [data-composition-id="cmp-chp-001"] {
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      --bar-height: 48px;
      --bar-alpha: 0.88;
      --rule-width: 1px;
      --rule-inset: 14px;
      --progress-line-height: 4px;
      --progress-edge-width: 3px;
      --segment-padding: 8px;
      --node: #12121a;
      --ink: #ffffff;
      --muted: rgba(255,255,255,0.70);
      --faint: rgba(255,255,255,0.44);
      --rule: rgba(255,255,255,0.22);
      --accent: #5fa0fa;
      --progress-alpha: 0.25;
    }
    [data-composition-id="cmp-chp-001"] {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;      /* 组件 transparent = true，画布底色交给外壳 */
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    /* 锚点负责落位与整块缩放；条本体只被 GSAP 做入场位移 */
    /* 锚点必须是整幅宽度：实例的位置由它承担平移，条本体保持全宽贴顶（与来源一致） */
    .cbar-anchor { position: absolute; left: 0; top: 0; width: 100%; transform-origin: top left; }
    .cbar {
      position: relative;
      display: flex;
      align-items: stretch;
      width: 100%;
      height: var(--bar-height);
      box-sizing: border-box;
      background: color-mix(in srgb, var(--node) calc(var(--bar-alpha) * 100%), transparent);
      border-bottom: var(--rule-width) solid var(--rule);
    }
    .cbar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: color-mix(in srgb, var(--accent) calc(var(--progress-alpha) * 100%), transparent); }
    .cbar-fill-edge { position: absolute; right: 0; top: 0; bottom: 0; width: var(--progress-edge-width); background: var(--accent); opacity: 0.9; }
    .cbar-segment { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 var(--segment-padding); }
    .cbar-rule { position: absolute; left: 0; top: var(--rule-inset); bottom: var(--rule-inset); width: var(--rule-width); background: var(--rule); }
    .cbar-label { white-space: pre; font-weight: 600; color: var(--faint); }
    .cbar-segment[data-chapter-state="on"] .cbar-label { font-weight: 800; color: var(--ink); }
    .cbar-segment[data-chapter-state="done"] .cbar-label { color: var(--muted); }
    .cbar-prog { position: absolute; left: 0; bottom: 0; height: var(--progress-line-height); width: 0; background: var(--accent); }
  </style>
</head>
<body>
  <div data-composition-id="cmp-chp-001" data-width="1920" data-height="1080">
    <div class="cbar-anchor" data-anchor>
      <div class="cbar" data-bar>
        <div class="cbar-fill" data-fill><div class="cbar-fill-edge" data-fill-edge></div></div>
        <!-- 章节格子由合成脚本按内容树生成 -->
        <div class="cbar-segments" data-segments style="display: contents"></div>
      </div>
    </div>

    <!-- 样例内容（与 model.js createSampleState 同源：4 章均分 12 秒）。运行时由宿主补丁替换。 -->
    <script type="application/json" data-hf-content>
      {
        "chapters": [
          {"id": "chapter-1", "label": "开场说明", "startMs": 0, "endMs": 3000},
          {"id": "chapter-2", "label": "问题背景", "startMs": 3000, "endMs": 6000},
          {"id": "chapter-3", "label": "解决过程", "startMs": 6000, "endMs": 9000},
          {"id": "chapter-4", "label": "结果回顾", "startMs": 9000, "endMs": 12000}
        ]
      }
    </script>

    <script src="/vendor/gsap.min.js"></script>
    <!-- 画布底色：合成被直接当顶层加载时，也要自己把外壳给的底色铺到 <html> 上 -->
    <script src="/vendor/canvas-backdrop.js"></script>
    <script>
      (function () {
        const COMPOSITION_ID = "cmp-chp-001";
        const MIN_LABEL_FONT_SIZE = 14;
        const ENTRANCE_SECONDS = 0.7;                 // transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1)
        const ENTRANCE_EASE = "power3.out";
        const SURFACE_TOKENS = {
          DARK: {node: "#12121a", ink: "#ffffff", muted: "rgba(255,255,255,0.70)", faint: "rgba(255,255,255,0.44)", rule: "rgba(255,255,255,0.22)"},
          LIGHT: {node: "#ece6e0", ink: "#1a2540", muted: "rgba(26,37,64,0.66)", faint: "rgba(26,37,64,0.42)", rule: "rgba(255,255,255,0.85)"},
        };

        const root = document.querySelector('[data-composition-id="' + COMPOSITION_ID + '"]');
        const hf = window.__hyperframes || {};
        const anchor = root.querySelector("[data-anchor]");
        const bar = root.querySelector("[data-bar]");
        const fill = root.querySelector("[data-fill]");
        const segmentsHost = root.querySelector("[data-segments]");
        let timeline = null;

        // 与 layout.js textWidth 同源：Chrome 会在每个字符后加字距（含最后一个），测量只算字形前进宽度，
        // 所以这里自己补上字距，保证收缩后的标签一定放得下。
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const glyphWidth = (text, fontSize, fontWeight) => {
          ctx.font = `${fontWeight} ${fontSize}px ${window.getComputedStyle(root).getPropertyValue("--font-body")}`;
          return ctx.measureText(text).width;
        };
        const textWidth = (text, fontSize, fontWeight, letterSpacing) => glyphWidth(text, fontSize, fontWeight) + [...text].length * letterSpacing;

        function optionsOf(variables) {
          const surface = String(variables.surface || "DARK").toUpperCase();
          return {
            surface,
            variant: String(variables.variant || "FILL").toUpperCase() === "LINE" ? "LINE" : "FILL",
            showProgress: variables.showProgress === undefined ? true : Boolean(variables.showProgress),
            accent: String(variables.accent || "#5fa0fa"),
            size: Math.min(2, Math.max(0.05, Number(variables.size) || 1)),
            // 高度：只放大条高与字号，宽度始终满幅（用户要求的「高度条件」）
            heightScale: Math.min(3, Math.max(0.5, Number(variables.heightScale) || 1)),
            duration: Math.max(1, Number(variables.duration) || 12),
            position: {
              x: Math.min(1, Math.max(0, Number(variables["position-x"] ?? 0.5))),
              y: Math.min(1, Math.max(0, Number(variables["position-y"] ?? 0.5))),
            },
          };
        }

        function readInlineContent() {
          const node = root.querySelector("script[data-hf-content]");
          return node ? JSON.parse(node.textContent) : {chapters: []};
        }

        // 章节等分格 + 标签收缩（与 layout.js calculateChapterBarLayout 同源）
        function buildSegments(chapters, options) {
          const barWidth = root.clientWidth || 1920;
          const segmentWidth = barWidth / chapters.length;
          const padding = 8;
          const ruleWidth = 1;
          const available = segmentWidth - padding * 2 - ruleWidth;
          const baseFontSize = 21;
          const heightScale = options.heightScale ?? 1;
          const overflow = [];
          segmentsHost.textContent = "";
          const views = chapters.map((chapter, index) => {
            const targetFontSize = baseFontSize * heightScale;
            const baseSpacing = targetFontSize * 0.08;
            let fontSize = targetFontSize;
            if (textWidth(chapter.label, targetFontSize, 600, baseSpacing) > available) {
              fontSize = Math.max(MIN_LABEL_FONT_SIZE, targetFontSize * (available / textWidth(chapter.label, targetFontSize, 600, baseSpacing)));
            }
            const letterSpacing = fontSize * 0.08;
            const fitted = textWidth(chapter.label, fontSize, 600, letterSpacing);
            if (fitted > available + 0.5) overflow.push({id: chapter.id, label: chapter.label});

            const segment = document.createElement("div");
            segment.className = "cbar-segment";
            segment.setAttribute("data-chapter-id", chapter.id);
            segment.setAttribute("data-chapter-index", String(index));
            segment.setAttribute("data-chapter-state", "todo");
            if (index > 0) {
            const rule = document.createElement("div");
              rule.className = "cbar-rule";
              segment.appendChild(rule);
            }
            const label = document.createElement("span");
            label.className = "cbar-label";
            label.setAttribute("data-cbar-label", "");
            label.style.fontSize = fontSize + "px";
            label.style.letterSpacing = letterSpacing + "px";
            label.textContent = chapter.label;
            segment.appendChild(label);

            let progress = null;
            if (options.variant === "LINE") {
              progress = document.createElement("div");
              progress.className = "cbar-prog";
              progress.setAttribute("data-cbar-prog", "");
              progress.style.width = "0%";
              segment.appendChild(progress);
            }
            segmentsHost.appendChild(segment);
            return {chapter, index, segment, progress};
          });
          return {views, overflow, segmentWidth, available};
        }

        function paintTokens(options) {
          const tokens = SURFACE_TOKENS[options.surface] || SURFACE_TOKENS.DARK;
          root.style.setProperty("--node", tokens.node);
          root.style.setProperty("--ink", tokens.ink);
          root.style.setProperty("--muted", tokens.muted);
          root.style.setProperty("--faint", tokens.faint);
          root.style.setProperty("--rule", tokens.rule);
          root.style.setProperty("--accent", options.accent);
          root.setAttribute("data-surface", options.surface);
          root.setAttribute("data-variant", options.variant);
          root.setAttribute("data-show-progress", options.showProgress ? "on" : "off");
          // 条高 / 分隔线内缩 / 进度线 / 高光边都跟着 heightScale 走，宽度不动
          const heightScale = options.heightScale ?? 1;
          root.style.setProperty("--bar-height", `${48 * heightScale}px`);
          root.style.setProperty("--rule-inset", `${14 * heightScale}px`);
          root.style.setProperty("--progress-line-height", `${4 * heightScale}px`);
          root.style.setProperty("--progress-edge-width", `${Math.max(1, 3 * heightScale)}px`);
          root.setAttribute("data-height-scale", String(heightScale));
        }

        // 落位与大小按工作台的实例包装层语义（platform/remotion/component-sample.jsx）：
        //   · 位置：外层包装层 translate((x-0.5)*100%, (y-0.5)*100%)，平移量按画布比例
        //   · 大小：组件自身盒子上的独立 scale 属性（不是 transform），这样不会随缩放漂移，
        //           也不会和组件自带的 transform 入场动画互相覆盖
        function applyLayout(options) {
          anchor.style.transform = `translate(${((options.position.x - 0.5) * 100).toFixed(3)}%, ${((options.position.y - 0.5) * 100).toFixed(3)}%)`;
          bar.style.scale = String(options.size);
          root.setAttribute("data-instance-scale", String(options.size));
        }

        // 进度是时间函数，所以整条进度都做成可 Seek 的 GSAP 补间（不用 rAF）
        function buildTimeline(chapters, views, options) {
          if (!timeline) {
            timeline = gsap.timeline({paused: true});
            window.__timelines = window.__timelines || {};
            window.__timelines[COMPOSITION_ID] = timeline;
          }
          // 重建前清掉上一条时间线留下的内联属性：from() 会把上次的终值当成终点，否则条会卡在屏幕外
          const touched = new Set();
          timeline.getChildren(true, true, true).forEach(child => {
            const targets = typeof child.targets === "function" ? child.targets() : [];
            (Array.isArray(targets) ? targets : [targets]).forEach(node => {
              if (node && node.nodeType === 1) touched.add(node);
            });
          });
          timeline.clear();
          if (touched.size) gsap.set([...touched], {clearProps: "transform,opacity,filter"});
          timeline.from(bar, {yPercent: -110, duration: ENTRANCE_SECONDS, ease: ENTRANCE_EASE}, 0);
          const showFill = options.showProgress && options.variant === "FILL";
          fill.style.opacity = showFill ? "1" : "0";
          views.forEach((view, index) => {
            const start = view.chapter.startMs / 1000;
            const end = view.chapter.endMs / 1000;
            const span = Math.max(0.001, end - start);
            const toPercent = ((index + 1) / views.length) * 100;
            // 当前章 / 已完成章 / 未开始章：三个状态在章边界上切换（data-* 用 GSAP 的 attr 插件写）
            timeline.set(view.segment, {attr: {"data-chapter-state": "on"}}, start);
            if (index > 0) timeline.set(view.segment, {attr: {"data-chapter-state": "todo"}}, 0);
            if (showFill) timeline.to(fill, {width: toPercent + "%", duration: span, ease: "none"}, start);
            if (view.progress) {
              timeline.fromTo(view.progress, {width: "0%"}, {width: "100%", duration: span, ease: "none"}, start);
              timeline.set(view.progress, {width: "0%"}, end);
            }
            timeline.set(view.segment, {attr: {"data-chapter-state": "done"}}, end);
          });
          return timeline;
        }

        function render(variables, content) {
          const options = optionsOf(variables);
          const chapters = (content && Array.isArray(content.chapters) ? content.chapters : []).slice(0, 8);
          if (chapters.length < 2) throw new Error("章节进度条至少需要 2 章内容。");
          paintTokens(options);
          const built = buildSegments(chapters, options);
          if (built.overflow.length) {
            throw new Error(`章节名称过长，无法在等分格内完整显示：${built.overflow.map(item => item.label).join("、")}。请缩短名称或减少章节数。`);
          }
          applyLayout(options);
          buildTimeline(chapters, built.views, options);
          root.setAttribute("data-chapter-count", String(chapters.length));
          if (typeof window.__hfForceTimelineRebind === "function") window.__hfForceTimelineRebind();
          return {chapters: chapters.length, options};
        }

        const bootVariables = typeof hf.getVariables === "function" ? hf.getVariables() : {};
        const boot = render(bootVariables, readInlineContent());
        root.setAttribute("data-ready-chapters", String(boot.chapters));

        // 契约 v2：内容树 + 选项一起补丁（数组内容不适合塞进标量变量）
        window.addEventListener("message", event => {
          const message = event.data;
          if (!message || message.type !== "hyperframes:patch" || message.compositionId !== COMPOSITION_ID) return;
          let result = {ok: true};
          try {
            const applied = render({...bootVariables, ...(message.options || {})}, message.content ?? readInlineContent());
            result = {ok: true, chapters: applied.chapters};
          } catch (error) {
            result = {ok: false, reason: error.message};
          }
          root.setAttribute("data-patch-revision", String(message.revision ?? 0));
          event.source?.postMessage({type: "hyperframes:patched", compositionId: COMPOSITION_ID, revision: message.revision ?? 0, ...result}, "*");
        });
      })();
    </script>
  </div>
</body>
</html>
