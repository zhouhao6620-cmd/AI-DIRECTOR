<!doctype html>
<!--
  CMP-STP-001 步骤时间线 · HyperFrames 子合成

  Role: Reference（HyperFrames 组件库改造，不是基线）
  事实源：workbench-v0/platform/components/step-timeline/**（只读复制）
          · 版式：标题 52·800·1.1 + 6px 强调竖条（高 1.05em、圆角 3）；点线导轨 left 11 / 上下内缩 18 / 2px；
            节点 24 环 + 8 圆点；胶囊最小 320×74、圆角 15、描边 2、文字 36·800·0.02em；锚点 120×96
          · 动效：标题竖条 560ms 纵向展开；步骤按 staggerMs 逐条 560ms 滑入 48px、节点 460ms 弹入
          · 内容：{title, steps[{id,label}]}；标题里的 *关键词* 用强调色
-->
<html lang="zh-CN" data-composition-variables='[
  {"id":"surface","type":"enum","label":"底色","default":"DARK","options":[{"value":"DARK","label":"深色"},{"value":"LIGHT","label":"浅色"}]},
  {"id":"accent","type":"color","label":"强调色","default":"#5fa0fa"},
  {"id":"revealed","type":"number","label":"已揭示步数","default":3,"min":1,"max":8,"step":1},
  {"id":"stepMs","type":"number","label":"逐步节奏（毫秒）","default":240,"min":80,"max":1200,"step":20},
  {"id":"size","type":"number","label":"大小","default":1,"min":0.5,"max":2,"step":0.01},
  {"id":"duration","type":"number","label":"实例时长（秒）","default":12,"min":3,"max":60,"step":0.1}
]'>
<head><script src="/engine/hyperframes/hyperframe.runtime.iife.js"></script>
  <meta charset="utf-8">
  <title>CMP-STP-001 步骤时间线 · HyperFrames</title>
  <style>
    [data-composition-id="cmp-stp-001"] {
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      --ink: #ffffff; --muted: rgba(255,255,255,0.70); --faint: rgba(255,255,255,0.44);
      --track: rgba(255,255,255,0.16); --node: #12121a; --accent: #5fa0fa;
      --glass: linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.045));
      --glass-border: rgba(255,255,255,0.22);
      --glass-shadow: 0 30px 70px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative; width: 1920px; height: 1080px; overflow: hidden;
      background: transparent; font-family: var(--font-body); -webkit-font-smoothing: antialiased;
    }
    .st-title { position: absolute; left: 0; top: 0; display: flex; align-items: center; }
    .st-bar { border-radius: 3px; background: var(--accent); transform-origin: top center; }
    .st-title-text { font-weight: 800; letter-spacing: -0.01em; }
    .st-rail { position: absolute; border-left-style: dotted; border-left-color: var(--track); }
    .st-list { position: absolute; left: 0; }
    .st-step { position: absolute; left: 0; display: flex; align-items: center; }
    .st-node { position: relative; border-radius: 50%; border-style: solid; border-color: var(--track); background: var(--node); display: grid; place-items: center; flex: none; }
    .st-node i { display: block; border-radius: 50%; background: var(--accent); }
    .st-chip { box-sizing: border-box; display: flex; align-items: center; border-radius: 15px; border-style: solid;
      border-color: var(--glass-border); background: var(--glass); box-shadow: var(--glass-shadow); color: var(--ink); }
  </style>
</head>
<body>
  <div data-composition-id="cmp-stp-001" data-width="1920" data-height="1080">
    <div data-scope><div data-box style="position:absolute;inset:0">
      <div class="st-title" data-title><span class="st-bar" data-bar></span><span class="st-title-text" data-title-text></span></div>
      <div class="st-rail" data-rail></div>
      <div class="st-list" data-list></div>
    </div></div>

    <script type="application/json" data-hf-content>
      {"title": "《本期*章节*大纲》", "steps": [{"id": "stage-1", "label": "开场钩子"}, {"id": "stage-2", "label": "干货主体"}, {"id": "stage-3", "label": "结尾升华"}]}
    </script>

    <script src="/vendor/gsap.min.js"></script>
    <script src="/vendor/canvas-backdrop.js"></script>
    <script src="/vendor/hf-component-kit.js"></script>
    <script>
      (function () {
        const GEO = {anchorInsetX: 120, anchorInsetY: 96, titleFontSize: 52, titleLetterSpacingEm: -0.01, titleLineHeight: 1.1,
          titleBarWidth: 6, titleBarHeightEm: 1.05, titleGap: 18, titleMarginBottom: 34, listGap: 22,
          railLeft: 11, railInset: 18, railWidth: 2, nodeSize: 24, nodeBorderWidth: 2, nodeDotSize: 8, nodeGap: 24,
          chipPaddingX: 30, chipPaddingY: 16, chipMinWidth: 320, chipMinHeight: 74, chipRadius: 15, chipBorderWidth: 2,
          chipFontSize: 36, chipLetterSpacingEm: 0.02, emptyChipOpacity: 0.5, staggerMs: 240, stepEnterMs: 560, nodeEnterMs: 460,
          barEnterMs: 560, slideDistance: 48};
        const SURFACE_TOKENS = {
          DARK: {ink: "#ffffff", muted: "rgba(255,255,255,0.70)", track: "rgba(255,255,255,0.16)", node: "#12121a",
            glass: "linear-gradient(160deg, rgba(255,255,255,0.11), rgba(255,255,255,0.045))", glassBorder: "rgba(255,255,255,0.22)",
            shadow: "0 30px 70px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.12)"},
          LIGHT: {ink: "#1a2540", muted: "rgba(26,37,64,0.66)", track: "rgba(26,37,64,0.13)", node: "#ece6e0",
            glass: "linear-gradient(160deg, rgba(255,255,255,0.52), rgba(255,255,255,0.20))", glassBorder: "rgba(255,255,255,0.85)",
            shadow: "0 22px 54px rgba(88,70,104,0.16), 0 3px 10px rgba(88,70,104,0.08), inset 0 1px 0 rgba(255,255,255,0.95)"},
        };
        const parseRuns = text => {
          const source = String(text ?? "");
          const runs = [];
          let buffer = "";
          let emphasis = false;
          for (const character of source) {
            if (character === "*") { if (buffer) runs.push({text: buffer, emphasis}); buffer = ""; emphasis = !emphasis; }
            else buffer += character;
          }
          if (buffer) runs.push({text: buffer, emphasis});
          return runs;
        };

        hfComponentKit.mount({
          id: "cmp-stp-001",
          mount: "instance",
          tokens: SURFACE_TOKENS,
          options: variables => ({
            surface: String(variables.surface || "DARK").toUpperCase(),
            accent: String(variables.accent || "#5fa0fa"),
            revealed: Math.max(1, Number(variables.revealed ?? 3)),
            stepMs: Math.min(1200, Math.max(80, Number(variables.stepMs) || 240)),
            size: Math.min(2, Math.max(0.5, Number(variables.size) || 1)),
            duration: Math.max(3, Number(variables.duration) || 12),
          }),
          applyTokens(ctx) {
            const tokens = ctx.tokens ?? SURFACE_TOKENS.DARK;
            ctx.root.style.setProperty("--ink", tokens.ink);
            ctx.root.style.setProperty("--muted", tokens.muted);
            ctx.root.style.setProperty("--track", tokens.track);
            ctx.root.style.setProperty("--node", tokens.node);
            ctx.root.style.setProperty("--glass", tokens.glass);
            ctx.root.style.setProperty("--glass-border", tokens.glassBorder);
            ctx.root.style.setProperty("--accent", ctx.options.accent);
            ctx.root.setAttribute("data-surface", ctx.options.surface);
          },
          build(ctx) {
            const {root, content, options, timeline} = ctx;
            const title = root.querySelector("[data-title]");
            const bar = root.querySelector("[data-bar]");
            const titleText = root.querySelector("[data-title-text]");
            const rail = root.querySelector("[data-rail]");
            const list = root.querySelector("[data-list]");
            const scale = options.size;
            const steps = (Array.isArray(content.steps) ? content.steps : []).slice(0, 8);
            const titleSource = String(content.title ?? "");
            if (!steps.length) ctx.reject("步骤时间线至少需要一步。");

            const anchorX = GEO.anchorInsetX * scale;
            const anchorY = GEO.anchorInsetY * scale;
            const titleFontSize = GEO.titleFontSize * scale;
            title.style.cssText = `left:${anchorX}px;top:${anchorY}px;gap:${GEO.titleGap * scale}px;`;
            bar.style.cssText = `width:${GEO.titleBarWidth * scale}px;height:${titleFontSize * GEO.titleBarHeightEm}px;`;
            titleText.style.fontSize = `${titleFontSize}px`;
            titleText.textContent = "";
            parseRuns(titleSource).forEach(run => {
              const node = document.createElement("span");
              node.setAttribute("data-st-key", run.emphasis ? "true" : "false");
              node.style.color = run.emphasis ? options.accent : "var(--ink)";
              node.textContent = run.text;
              titleText.appendChild(node);
            });

            const chipFontSize = GEO.chipFontSize * scale;
            const chipPadX = GEO.chipPaddingX * scale;
            const chipPadY = GEO.chipPaddingY * scale;
            const rowHeight = Math.max(GEO.chipMinHeight * scale, chipFontSize * 1.2 + chipPadY * 2, GEO.nodeSize * scale);
            const listTop = anchorY + titleFontSize * GEO.titleLineHeight + GEO.titleMarginBottom * scale;
            const listHeight = steps.length * rowHeight + (steps.length - 1) * GEO.listGap * scale;
            rail.style.cssText = `left:${anchorX + GEO.railLeft * scale}px;top:${listTop + GEO.railInset * scale}px;`
              + `height:${Math.max(0, listHeight - GEO.railInset * 2 * scale)}px;border-left-width:${GEO.railWidth * scale}px;`;
            list.style.cssText = `top:${listTop}px;width:${1200 * scale}px;height:${listHeight}px;`;
            list.textContent = "";
            const rows = steps.map((step, index) => {
              const row = document.createElement("div");
              row.className = "st-step";
              const empty = index >= options.revealed;
              row.setAttribute("data-st-step-id", step.id ?? `step-${index}`);
              row.setAttribute("data-st-step-index", String(index));
              row.setAttribute("data-st-step-state", empty ? "empty" : "revealed");
              row.style.cssText = `left:${anchorX}px;top:${index * (rowHeight + GEO.listGap * scale)}px;gap:${GEO.nodeGap * scale}px;height:${rowHeight}px;`
                + (empty ? `opacity:${GEO.emptyChipOpacity};` : "");
              const node = document.createElement("span");
              node.className = "st-node";
              node.style.cssText = `width:${GEO.nodeSize * scale}px;height:${GEO.nodeSize * scale}px;border-width:${GEO.nodeBorderWidth * scale}px;`;
              const dot = document.createElement("i");
              dot.style.cssText = `width:${GEO.nodeDotSize * scale}px;height:${GEO.nodeDotSize * scale}px;`;
              node.appendChild(dot);
              const chip = document.createElement("span");
              chip.className = "st-chip";
              chip.style.cssText = `min-width:${GEO.chipMinWidth * scale}px;min-height:${GEO.chipMinHeight * scale}px;`
                + `padding:${chipPadY}px ${chipPadX}px;border-radius:${GEO.chipRadius * scale}px;border-width:${GEO.chipBorderWidth * scale}px;`
                + `font-size:${chipFontSize}px;font-weight:800;letter-spacing:${chipFontSize * GEO.chipLetterSpacingEm}px;`;
              chip.textContent = String(step.label ?? "");
              row.append(node, chip);
              list.appendChild(row);
              return {row, node};
            });

            timeline.from(bar, {scaleY: 0, duration: GEO.barEnterMs / 1000, ease: "power3.out"}, 0);
            rows.forEach(({row, node}, index) => {
              const at = 0.16 + (index * options.stepMs) / 1000;
              timeline.from(row, {opacity: 0, x: -GEO.slideDistance * scale, duration: GEO.stepEnterMs / 1000, ease: "power3.out"}, at);
              timeline.from(node, {scale: 0.6, opacity: 0, duration: GEO.nodeEnterMs / 1000, ease: "back.out(1.6)"}, at + 0.06);
            });
            ctx.setAttr(root, "data-step-count", steps.length);
            ctx.setAttr(root, "data-revealed", options.revealed);
            ctx.meta = {steps: steps.length, revealed: options.revealed};
          },
        });
      })();
    </script>
  </div>
</body>
</html>
